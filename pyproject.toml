[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-run-generator"
version = "0.1.0"
authors = [
  { name="MaybeItsAdam" },
]
description = "A Knowledge of London run generator using semantic Dijkstra"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "london",
    "knowledge",
    "taxi",
    "routing",
    "osm",
    "openstreetmap",
    "dijkstra",
    "gis",
    "navigation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "osmnx>=1.6",
    "geopy>=2.3",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "click>=8.0",
    "requests>=2.28",
]

[project.urls]
"Homepage" = "https://github.com/MaybeItsAdam/knowledge-run-generator"
"Bug Tracker" = "https://github.com/MaybeItsAdam/knowledge-run-generator/issues"

[project.scripts]
knowledge-run = "knowledge_run_generator.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"knowledge_run_generator.blue_book_demo" = ["*.txt", "*.json"]
"knowledge_run_generator.comparator" = ["data/*.json"]
