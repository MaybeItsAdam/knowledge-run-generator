name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile-check all Python sources
        run: |
          python -m compileall -q knowledge_run_generator scripts tests

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      # The full route regression needs constants/qa_report.json, which is a
      # build artefact requiring the OSM graph — CI can't produce one, so the
      # per-run diff runs at promotion time instead (scripts/promote_to_app.py).
      # What CI *can* enforce is that the committed baseline is present and
      # carries real fingerprints, which is what silently rotted before: every
      # entry had an empty route_hash, so the geometry check never fired.
      - name: Check the regression baseline is alive
        run: |
          python - <<'PY'
          import sys
          from knowledge_run_generator.regression import (
              DEFAULT_BASELINE_PATH, load_snapshot,
          )

          snap = load_snapshot(DEFAULT_BASELINE_PATH)
          hashed = sum(1 for fp in snap.runs.values() if fp.route_hash)
          ordered = sum(1 for fp in snap.runs.values()
                        if fp.ordered_coverage is not None)
          print(f"baseline: {snap.total} runs, {snap.passed} passed, "
                f"{snap.fully_ordered} fully ordered")
          print(f"  fingerprints with a route hash: {hashed}/{snap.total}")
          print(f"  fingerprints with ordered coverage: {ordered}/{snap.total}")

          if not snap.total:
              sys.exit("baseline has no runs")
          if not hashed:
              sys.exit(
                  "no baseline fingerprint carries a route_hash — the "
                  "geometry-change check cannot fire. Regenerate with "
                  "`krg generate runs && krg regression snapshot`."
              )
          if not ordered:
              sys.exit(
                  "no baseline fingerprint carries ordered_coverage — Blue "
                  "Book fidelity is not being tracked."
              )
          PY

  webapp-template:
    name: Webapp template (HTML + inline JS parse)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20 (for `node --check`)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Render index.html and parse inline JS
        run: |
          python - <<'PY'
          import re, pathlib, sys
          from knowledge_run_generator.webapp import app

          response = app.test_client().get("/")
          assert response.status_code == 200, response.status_code
          html = response.data.decode()

          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          assert scripts, "no inline <script> block in rendered HTML"
          js = scripts[-1]
          pathlib.Path("inline.js").write_text(js)
          print(f"inline JS bytes: {len(js)}")
          PY
          node --check inline.js
