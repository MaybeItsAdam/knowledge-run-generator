name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile-check all Python sources
        run: |
          python -m compileall -q knowledge_run_generator scripts tests

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  webapp-template:
    name: Webapp template (HTML + inline JS parse)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20 (for `node --check`)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Render index.html and parse inline JS
        run: |
          python - <<'PY'
          import re, pathlib, sys
          from knowledge_run_generator.webapp import app

          response = app.test_client().get("/")
          assert response.status_code == 200, response.status_code
          html = response.data.decode()

          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          assert scripts, "no inline <script> block in rendered HTML"
          js = scripts[-1]
          pathlib.Path("inline.js").write_text(js)
          print(f"inline JS bytes: {len(js)}")
          PY
          node --check inline.js
